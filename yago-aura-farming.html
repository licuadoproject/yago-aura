<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yago AURA FARMING</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23160000%27/%3E%3Ctext x=%2750%27 y=%2778%27 font-size=%2772%27 text-anchor=%27middle%27%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<style>
  :root { --fire1:#ff2a00; --fire2:#ff9100; --fire3:#ffe600; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: Impact, "Arial Black", "Haettenschweiler", sans-serif; }
  #root { position: fixed; inset: 0; background: #000; overflow: hidden; }

  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fire, #fire2 { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; z-index: 5; opacity: .5; }
  #fire2 { transform: scaleY(-1); opacity: .18; z-index: 4; }

  .heat { position: absolute; inset: 0; z-index: 6; pointer-events: none; mix-blend-mode: overlay;
    opacity: .45; background: linear-gradient(to top, rgba(255,70,0,.75), rgba(255,140,0,.15) 45%, rgba(255,0,0,.15)); }
  .scan { position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: .35;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.45) 2px 4px); }
  .vig { position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.85) 100%); }
  #flash { position: absolute; inset: 0; z-index: 9; pointer-events: none; background: #fff3d0; opacity: 0; mix-blend-mode: screen; }

  #pop { position: absolute; z-index: 10; pointer-events: none; color: #fff; font-size: clamp(34px, 9vw, 130px);
    letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; opacity: 0;
    text-shadow: 0 0 6px #ff0, 0 0 18px #ff7a00, 0 0 40px #ff2a00, 4px 4px 0 #b00000, -3px -3px 0 #000;
    -webkit-text-stroke: 2px #000; }
  #pop.go { animation: popIn 1.1s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes popIn {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(4) rotate(var(--r,-8deg)); filter: blur(6px); }
    12%  { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(var(--r,-8deg)); filter: blur(0); }
    70%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08) rotate(var(--r,-8deg)); }
    100% { opacity: 0; transform: translate(-50%,-60%) scale(1.3) rotate(var(--r,-8deg)); }
  }

  #aura { position: absolute; z-index: 10; left: 14px; top: 12px; color: #ffd24a; font-size: clamp(16px, 2.6vw, 34px);
    text-shadow: 0 0 10px #ff6a00, 2px 2px 0 #000; letter-spacing: 1px; opacity: 0; transition: opacity .6s; }
  #aura b { color: #fff; font-weight: normal; font-variant-numeric: tabular-nums; }

  /* Pantalla de inicio */
  #start { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 4vh, 40px); background: radial-gradient(ellipse at 50% 100%, rgba(120,20,0,.55), rgba(0,0,0,.92) 70%);
    transition: opacity .8s, visibility .8s; text-align: center; padding: 20px; }
  #start.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  h1 { font-size: clamp(40px, 11vw, 150px); line-height: .95; text-transform: uppercase; letter-spacing: 3px;
    background: linear-gradient(to top, #ff1a00 0%, #ff8a00 40%, #ffe600 75%, #fff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px #ff4d00) drop-shadow(3px 3px 0 #000); animation: flick 2.2s infinite; }
  h1 span { display: block; font-size: .62em; letter-spacing: 8px; }
  @keyframes flick { 0%,100% { filter: drop-shadow(0 0 14px #ff4d00) drop-shadow(3px 3px 0 #000) brightness(1);} 40% { filter: drop-shadow(0 0 26px #ff7a00) drop-shadow(3px 3px 0 #000) brightness(1.25);} 70% { filter: drop-shadow(0 0 10px #ff2a00) drop-shadow(3px 3px 0 #000) brightness(.9);} }

  #play { width: clamp(84px, 16vw, 140px); height: clamp(84px, 16vw, 140px); border-radius: 50%; border: 4px solid #ffd24a; cursor: pointer;
    background: radial-gradient(circle at 50% 40%, #ff9100, #c01800); color: #fff; font-size: clamp(36px, 7vw, 64px); padding-left: .12em;
    box-shadow: 0 0 30px #ff5a00, 0 0 80px rgba(255,60,0,.7), inset 0 0 20px rgba(255,230,0,.5); animation: beat .8s infinite; font-family: inherit; }
  #play:hover { filter: brightness(1.25); }
  @keyframes beat { 0%,100% { transform: scale(1);} 50% { transform: scale(1.1);} }

  #fs { position: absolute; z-index: 30; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(255,200,80,.5);
    background: rgba(0,0,0,.45); color: #ffd24a; cursor: pointer; font-size: 18px; line-height: 1; display: grid; place-items: center; opacity: .65; transition: opacity .2s; font-family: Arial, sans-serif; }
  #fs:hover { opacity: 1; }

  #yt { position: fixed; left: -9999px; top: 0; width: 220px; height: 220px; opacity: 0; pointer-events: none; }

</style>
</head>
<body>
<div id="root">
  <canvas id="stage"></canvas>
  <canvas id="fire2"></canvas>
  <canvas id="fire"></canvas>
  <div class="heat"></div>
  <div class="scan"></div>
  <div class="vig"></div>
  <div id="flash"></div>
  <div id="pop"></div>
  <div id="aura">AURA: <b id="auraN">0</b></div>

  <div id="start">
    <h1>Yago<span>AURA FARMING</span></h1>
    <button id="play" aria-label="Reproducir">▶</button>
  </div>


  <button id="fs" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
</div>
<div id="yt"></div>

/* =========================== UTILS =========================== */
const $ = id => document.getElementById(id);
const rnd = (a=1,b) => b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - clamp(t,0,1), 3);
const easeOutExp = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t,0,1));
const easeOutBack = t => { t = clamp(t,0,1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };

/* =========================== ESCENARIO (low-res) =========================== */
const stage = $('stage'), sctx = stage.getContext('2d');
let LW = 320, LH = 180;
function resize() {
  LW = innerWidth < 700 ? 200 : 320;
  LH = Math.max(60, Math.round(LW * innerHeight / innerWidth));
  stage.width = LW; stage.height = LH;
  sctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

/* =========================== FUEGO (estilo Doom, baja resolución) =========================== */
const FW = 128, FH = 72;
const fireC = $('fire'), fireC2 = $('fire2');
fireC.width = fireC2.width = FW; fireC.height = fireC2.height = FH;
const fctx = fireC.getContext('2d'), fctx2 = fireC2.getContext('2d');
const fire = new Uint8Array(FW * FH);
const img = fctx.createImageData(FW, FH);
const PAL = [];
for (let v = 0; v <= 36; v++) {
  const t = v / 36;
  PAL.push([255*Math.min(1, t*2.4), 255*clamp((t-.22)*2.1,0,1), 255*clamp((t-.8)*5,0,1)]);
}
let extraDecay = 0.5, srcLevel = 36;
function fireStep() {
  for (let x = 0; x < FW; x++) fire[(FH-1)*FW + x] = srcLevel;
  for (let y = 1; y < FH; y++) {
    for (let x = 0; x < FW; x++) {
      const s = y*FW + x, px = fire[s];
      if (px === 0) { fire[s-FW] = 0; continue; }
      const r = (Math.random()*4)|0;
      const d = s - r + 1;
      let nv = px - (r & 1) - (Math.random() < extraDecay ? 1 : 0);
      if (nv < 0) nv = 0;
      fire[d - FW] = nv;
    }
  }
  const dd = img.data;
  for (let i = 0; i < FW*FH; i++) {
    const v = fire[i], o = i*4;
    if (!v) { dd[o+3] = 0; continue; }
    const c = PAL[v];
    dd[o] = c[0]; dd[o+1] = c[1]; dd[o+2] = c[2]; dd[o+3] = Math.min(255, v*24);
  }
  fctx.putImageData(img, 0, 0);
  fctx2.clearRect(0,0,FW,FH); fctx2.drawImage(fireC, 0, 0);
}

let photos = [];
let loadedCount = 0, failedCount = 0;
function loadPhotos(list) {
  photos = []; loadedCount = 0; failedCount = 0;
  list.forEach(src => {
    const im = new Image();
    im.cut = src.startsWith('data:image/png');
    im.onload = () => { photos.push(im); loadedCount++; checkMissing(); };
    im.onerror = () => { failedCount++; checkMissing(); };
    im.src = src;
  });
}
function checkMissing() {}
loadPhotos(FOTOS);

/* =========================== MÚSICA (YouTube, aleatoria y en bucle) =========================== */
let ytPlayer = null, ytReady = false, wantPlay = false, lastTrack = -1, errCount = 0;
function pickTrack() {
  let i; do { i = (Math.random()*TRACKS.length)|0; } while (TRACKS.length > 1 && i === lastTrack);
  lastTrack = i; return TRACKS[i];
}
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  ytPlayer = new YT.Player('yt', {
    width: 220, height: 220, videoId: pickTrack(),
    playerVars: { controls: 0, playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, fs: 0 },
    events: {
      onReady: () => { ytReady = true; if (wantPlay) startMusic(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) { ytPlayer.loadVideoById(pickTrack()); }
        if (e.data === YT.PlayerState.PLAYING) errCount = 0;
      },
      onError: () => {
        if (++errCount < 8) setTimeout(() => ytPlayer.loadVideoById(pickTrack()), 400);
      }
    }
  });
};
function startMusic() {
  try { ytPlayer.unMute(); ytPlayer.setVolume(100); ytPlayer.playVideo(); } catch (e) {}
}

/* =========================== EDIT =========================== */
let playing = false, t0 = 0;
const beat = 60 / BPM;
let scene = null, lastPhoto = -1, order = [];
let impulse = 0, flashAmt = 0, glitch = 0, aura = 0;
const popEl = $('pop'), flashEl = $('flash');

function nextPhotoIndex() {
  if (!photos.length) return -1;
  if (!order.length) {
    order = photos.map((_, i) => i).sort(() => Math.random() - .5);
    if (order[0] === lastPhoto && order.length > 1) order.push(order.shift());
  }
  return lastPhoto = order.shift();
}
function newScene(now) {
  const idx = nextPhotoIndex();
  const beats = [2, 3, 4, 4, 6][(Math.random()*5)|0];
  const opaque = photos.map((q,i)=>i).filter(i => !photos[i].cut);
  const bg = opaque.length ? opaque[(Math.random()*opaque.length)|0] : idx;
  scene = { idx, bg, start: now, dur: beat * beats, fx: (Math.random()*6)|0, dir: Math.random() < .5 ? -1 : 1, rot: rnd(-.12,.12) };
  impulse = 1; flashAmt = 1; glitch = rnd(.3, .6);
  extraDecay = rnd(.8, .9);
  showPop();
}
function showPop() {
  popEl.textContent = POPS[(Math.random()*POPS.length)|0];
  popEl.style.left = rnd(30, 70) + '%';
  popEl.style.top = rnd(22, 78) + '%';
  popEl.style.setProperty('--r', rnd(-14, 14) + 'deg');
  popEl.classList.remove('go'); void popEl.offsetWidth; popEl.classList.add('go');
}

function drawCover(im, alpha, zoom) {
  const s = Math.max(LW / im.width, LH / im.height) * zoom;
  const w = im.width * s, h = im.height * s;
  sctx.globalAlpha = alpha;
  sctx.drawImage(im, (LW - w) / 2, (LH - h) / 2, w, h);
  sctx.globalAlpha = 1;
}

function render(now) {
  const T = now - t0;
  const phase = (T % beat) / beat;
  const pulse = Math.exp(-phase * 5);

  sctx.fillStyle = '#100000'; sctx.fillRect(0, 0, LW, LH);

  if (playing && photos.length) {
    if (!scene || now - scene.start >= scene.dur) newScene(now);
    const p = clamp((now - scene.start) / scene.dur, 0, 1);
    const im = photos[scene.idx];

    // Fondo: la misma foto en cover, oscura y ampliada
    const bgZoom = 1.25 + 0.15 * Math.sin(T * 1.7);
    drawCover(photos[scene.bg] || im, im.cut ? .7 : .55, bgZoom);
    sctx.fillStyle = 'rgba(40,0,0,.35)'; sctx.fillRect(0, 0, LW, LH);

    // Primer plano con efectos distintos por escena
    let s = Math.min(LW * .98 / im.width, LH * 1.0 / im.height);
    let rot = Math.sin(T * 2.3) * .015 + scene.rot * (1 - p) * .6, ox = 0, oy = 0, k = 1;
    switch (scene.fx) {
      case 0: k = 1 + .55 * (1 - easeOutExp(p * 3)) + .22 * p; break;                   // punch zoom
      case 1: rot += (1 - easeOut(p * 2.2)) * Math.PI * 1.5 * scene.dir; k = .25 + .85 * easeOutBack(p * 2.4) + .15 * p; break; // giro
      case 2: k = 1.05 + .35 * p; oy = Math.sin(T * 9) * 1.2; break;                    // push lento
      case 3: ox = (1 - easeOut(p * 3)) * LW * .9 * scene.dir; k = 1.15 + .1 * p; break; // whip
      case 4: k = 2.6 - 1.55 * easeOutExp(p * 2.2); break;                              // zoom-out
      case 5: k = 1 + .3 * Math.sin(p * Math.PI); rot += Math.sin(p * 12) * .05 * (1 - p); oy = (1 - easeOut(p * 3)) * LH * .6; break; // drop
    }
    k *= 1 + .05 * pulse;
    const sh = impulse * 6 + pulse * 1.2;
    ox += (Math.random() - .5) * sh; oy += (Math.random() - .5) * sh;

    sctx.save();
    sctx.translate(LW / 2 + ox, LH / 2 + oy);
    sctx.rotate(rot);
    sctx.scale(s * k, s * k);
    sctx.drawImage(im, -im.width / 2, -im.height / 2);
    sctx.restore();

    // Glitch: tiras desplazadas
    if (glitch > 0) {
      const n = 3 + ((Math.random() * 4) | 0);
      for (let i = 0; i < n; i++) {
        const y = (Math.random() * LH) | 0, h = 2 + ((Math.random() * 10) | 0), dx = ((Math.random() - .5) * 50) | 0;
        sctx.drawImage(stage, 0, y, LW, h, dx, y, LW, h);
      }
      sctx.fillStyle = 'rgba(255,0,0,.12)'; sctx.fillRect(0, 0, LW, LH);
    }

    // Filtro "edit": contraste y saturación al ritmo
    stage.style.filter = `contrast(${1.25 + pulse * .25}) saturate(${1.5 + pulse * .6}) brightness(${.9 + pulse * .35 + impulse * .3}) sepia(.25) hue-rotate(${-12 + Math.sin(T) * 6}deg)`;

    // Fuego reactivo
    extraDecay += ((.85 - pulse * .06) - extraDecay) * .05;

    // Aura
    aura += (800 + pulse * 2500) * (1 / 60);
    $('auraN').textContent = Math.floor(aura).toLocaleString('es-ES');
  } else {
    // Pantalla de inicio: llamas suaves
    extraDecay = .46;
    stage.style.filter = 'brightness(.6)';
  }

  impulse *= .86; glitch = Math.max(0, glitch - .03);
  flashAmt *= .8; flashEl.style.opacity = flashAmt * .55;
  // zoom global al compás
  stage.style.transform = playing ? `scale(${1 + pulse * .025})` : 'none';
}

let lastFire = 0;
function frame(ts) {
  const now = ts / 1000;
  if (!t0) t0 = now;
  if (now - lastFire > 1 / 40) { fireStep(); lastFire = now; }
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const root = document.documentElement;
$('fs').onclick = () => {
  const d = document;
  const inFs = d.fullscreenElement || d.webkitFullscreenElement;
  if (!inFs) { (root.requestFullscreen || root.webkitRequestFullscreen || (()=>{})).call(root); }
  else { (d.exitFullscreen || d.webkitExitFullscreen || (()=>{})).call(d); }
};
</script>
</body>
</html>
